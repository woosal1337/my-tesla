name: my-tesla
services:
  dashboard:
    image: ghcr.io/woosal1337/my-tesla:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://teslamate_ro:${TESLAMATE_RO_PASSWORD:?Set TESLAMATE_RO_PASSWORD}@database:5432/teslamate
      DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-UTC}
      IDENTITY_HEADER: ${IDENTITY_HEADER:-cf-access-authenticated-user-email}
      MQTT_URL: ${MQTT_URL:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    volumes:
      - dashboard-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - teslamate
networks:
  teslamate:
    external: true
    name: ${TESLAMATE_NETWORK:-teslamate_default}
volumes:
  dashboard-data:
